name: Integração contínua
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://teste:teste@127.0.0.1:1/isolado
      DIRECT_URL: postgresql://teste:teste@127.0.0.1:1/isolado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run prisma:validate
      - run: npm run openapi:validate
      - run: npm run build
