name: Integração contínua
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://teste:teste@127.0.0.1:1/isolado
      DIRECT_URL: postgresql://teste:teste@127.0.0.1:1/isolado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run prisma:validate
      - run: npm run openapi:validate
      - run: npm run build

  # Ponta a ponta com PostgreSQL descartável: aplica as migrations do zero e testa
  # login, escopo por unidade e demais regras com requisições HTTP reais.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ampara_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ampara_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ampara_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ampara_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run test:e2e
